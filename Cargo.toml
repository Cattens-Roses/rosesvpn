[workspace]
resolver = "3"
members = ["crates/rosesvpn", "crates/ui", "crates/icons", "crates/i18n", "crates/embed", "crates/vpn-engine"]

[workspace.package]
version = "0.42.2"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
embed = { path = "crates/embed" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
ui = { path = "crates/ui" }
anyhow = "1.0"
env_logger = "0.11"
futures = "0.3"
fluent-bundle = "0.16"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "5ff26c7dedb1c8e27b69f89be13ce2744484874a" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "5ff26c7dedb1c8e27b69f89be13ce2744484874a", features = [
  "font-kit",
  "wayland",
  "x11",
] }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
] }
log = "0.4"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "NSWorkspace"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "settings"] }
windows-sys = { version = "0.61", features = ["Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Rpc", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security"] }
serde = { version = "1.0", features = ["derive", "rc"] }
sys-locale = "0.3"
unic-langid = { version = "0.9", features = ["macros"] }
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package.ui]
debug = false
opt-level = 2

[profile.dev.package."*"]
debug = false
opt-level = 2
