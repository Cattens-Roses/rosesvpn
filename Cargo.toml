[workspace]
resolver = "3"
members = ["crates/rosesvpn", "crates/ui", "crates/icons", "crates/i18n", "crates/embed", "crates/vpn-engine", "vendor/gpui/crates/*", "vendor/gpui/crates/refineable/derive_refineable", "vendor/gpui/tooling/*"]

[workspace.package]
version = "0.42.2"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
embed = { path = "crates/embed" }
i18n = { path = "crates/i18n" }
icons = { path = "crates/icons" }
ui = { path = "crates/ui" }
